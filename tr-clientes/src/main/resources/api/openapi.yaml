openapi: 3.0.3
info:
  title: API de Clientes con OAuth2/OIDC
  description: Demo de microservicio con flujos de seguridad OAuth2 y OpenID Connect simulados.
  version: 1.0.0
servers:
  - url: /
    description: Servidor local

paths:
  /api/v1/auth/authorize:
    get:
      summary: Endpoint de Autorización (Simulado)
      description: Redirige al usuario para "autenticarse" y obtener un código.
      operationId: authorize
      tags:
        - Auth
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirección con código de autorización

  /api/v1/auth/token:
    post:
      summary: Intercambio de Token
      description: Intercambia un código de autorización por Access Token e ID Token.
      operationId: getToken
      tags:
        - Auth
      responses:
        '200':
          description: Tokens generados exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'

  /api/v1/auth/userinfo:
    get:
      summary: Información del Usuario (OIDC)
      description: Devuelve claims del usuario autenticado usando el Access Token.
      operationId: getUserInfo
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'

  /api/v1/clients:
    get:
      summary: Obtener todos los clientes
      operationId: getAllClients
      tags:
        - Clientes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Listado de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListCliente'
    post:
      summary: Crear un nuevo cliente
      operationId: createClient
      tags:
        - Clientes
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
      responses:
        '201':
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCliente'

  /api/v1/clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Obtener un cliente por su ID
      operationId: getClientById
      tags:
        - Clientes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCliente'
    put:
      summary: Actualizar un cliente
      operationId: updateClient
      tags:
        - Clientes
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
      responses:
        '200':
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCliente'
    delete:
      summary: Eliminar un cliente
      operationId: deleteClient
      tags:
        - Clientes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cliente eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    OAuthTokenResponse:
      type: object
      properties:
        access_token: {type: string}
        id_token: {type: string}
        token_type: {type: string, example: Bearer}
        expires_in: {type: integer}

    UserInfoResponse:
      type: object
      properties:
        sub: {type: string}
        name: {type: string}
        email: {type: string}
        preferred_username: {type: string}

    ClienteRequest:
      type: object
      required: [nombre, identificacion, clienteId, contrasenia]
      properties:
        nombre: {type: string}
        genero: {type: string}
        edad: {type: integer, minimum: 18}
        identificacion: {type: string}
        direccion: {type: string}
        telefono: {type: string}
        clienteId: {type: string}
        contrasenia: {type: string}
        estado: {type: boolean, default: true}

    ClienteResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        clienteId: {type: string}
        nombre: {type: string}
        genero: {type: string}
        edad: {type: integer}
        identificacion: {type: string}
        direccion: {type: string}
        telefono: {type: string}
        estado: {type: boolean}

    ApiResponseBase:
      type: object
      properties:
        status: {type: boolean}
        message: {type: string}

    ApiResponseCliente:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ClienteResponse'}

    ApiResponseListCliente:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: array
              items: {$ref: '#/components/schemas/ClienteResponse'}

    ApiResponseVoid:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: {type: object, nullable: true}

    ApiResponseError:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: {type: object, nullable: true}
